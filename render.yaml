# Carousel Factory on Render - ONE web service, and that is deliberate.
#
# Everything runs in this single process: the React console, the JSON API, the
# Telegram review pages, the pipeline runs themselves (driven by Google ADK),
# and the news fetcher on an in-process schedule.
#
# ADK powers the agents, the session store and the artifact store, but none of
# its own web surface is served - see the module docstring in web_app.py.
#
# WHY NOT MORE SERVICES
#
# The obvious split (a web service plus cron jobs) is wrong here, and not just
# for cost. A run is driven by an asyncio task inside this process, live events
# fan out through an in-process bus, and startup recovery reclaims any run left
# in an active phase - on the assumption that no other process could still own
# it. A second instance breaks that assumption: it would boot, decide the first
# instance's live runs were dead, mark them interrupted and free their queued
# news items for someone else to pick up. That is why numInstances is pinned to
# 1 and autoscaling must stay off. If this ever needs to scale out, the fix is
# a lease (runs.owner_id plus a heartbeat) and Postgres LISTEN/NOTIFY in place
# of the in-process bus - not simply raising this number.
#
# WHY NOT THE FREE PLAN
#
# Free web services spin down after ~15 minutes idle. This pipeline runs for
# 15-20 minutes per carousel and pauses for hours waiting on a human, so a
# spin-down would kill generations mid-flight and stop the scheduler from ever
# firing. Starter is the floor.
#
# AFTER THE FIRST DEPLOY
#
# Set PUBLIC_BASE_URL to this service's public URL (Render blueprints cannot
# self-reference one). The Telegram review button is built from it, and
# Telegram refuses a non-public URL in a button - so until it is set, review
# notifications carry a plain-text link instead of a tappable one.
#

services:
  - type: web
    name: carousel-factory
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Colocated with the Supabase project (aws-0-us-west-1), NOT with the
    # user. Measured from India: a bare "SELECT 1" against that database takes
    # ~560 ms, and several endpoints make more than one query, so the round
    # trips dominate everything else.
    #
    #   app in Singapore : 60 ms browser hop + ~180 ms per query
    #   app in Oregon    : 230 ms browser hop + ~20 ms per query
    #
    # One browser hop happens per page; queries happen several times per page,
    # so sitting next to the database wins. If the Supabase project is ever
    # moved to ap-south-1, move this to singapore with it.
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: false

    envVars:
      # --- app ------------------------------------------------------------
      # APP_NAME is intentionally absent: it is derived from the agent package
      # directory (app/), which is the only value ADK will key sessions on.
      # Setting it to anything else silently breaks every resume.
      - key: PUBLIC_BASE_URL
        sync: false          # https://<service>.onrender.com
      - key: MAX_CAROUSEL_SLIDES
        value: "10"

      # --- cost control ---------------------------------------------------
      # A carousel costs real image and reasoning credits. These are the only
      # thing between a bug and an invoice.
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_RUNS_PER_DAY
        value: "10"

      # --- models ---------------------------------------------------------
      - key: OPENAI_API_KEY
        sync: false
      - key: PLANNER_MODEL
        value: openai/gpt-5.6-sol
      - key: UTILITY_MODEL
        value: openai/gpt-5.4-mini
      - key: PHRASING_MODEL
        value: openai/gpt-5.5
      - key: IMAGE_MODEL
        value: gpt-image-2

      # --- database -------------------------------------------------------
      # MUST be the Supabase SESSION pooler on port 5432. Not
      # db.<ref>.supabase.co (IPv6-only, unreachable from Render) and not the
      # transaction pooler on 6543 (no prepared statements, which asyncpg
      # requires). Percent-encode any @ in the password as %40.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_RECYCLE_S
        value: "280"

      # --- supabase storage + auth ----------------------------------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false          # public by design; ships in the browser bundle
      - key: SUPABASE_S3_REGION
        value: us-west-1
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: MEDIA_BUCKET
        value: corousel-media

      # --- console auth ---------------------------------------------------
      # SESSION_SECRET signs our own cookie (unrelated to Supabase's keys).
      # generateValue gives a strong one, but it must then stay PUT: rotating
      # it signs everyone out. At least 32 bytes.
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_S
        value: "43200"
      - key: AUTH_BOOTSTRAP_EMAILS
        sync: false          # seeds app_users only while that table is empty

      # --- channels -------------------------------------------------------
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # --- instagram ------------------------------------------------------
      # IG_USER_ID, IG_ACCESS_TOKEN and IG_HANDLE are gone. Accounts are
      # connected from the console (Profile -> Instagram) and their tokens are
      # stored encrypted in the instagram_accounts table; the handle is a
      # property of the account a run targets, not of the deployment.
      #
      # These two identify this console to Meta. The redirect URI to allowlist
      # in the Meta app is <PUBLIC_BASE_URL>/api/settings/instagram/callback.
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false

      # --- cta destinations -----------------------------------------------
      - key: SUBSTACK_URL
        sync: false
      - key: YOUTUBE_URL
        sync: false

      # --- news sources ---------------------------------------------------
      - key: RSS_FEEDS
        sync: false
      - key: YOUTUBE_CHANNELS
        sync: false

      # --- observability (optional; empty keys disable tracing) -----------
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
